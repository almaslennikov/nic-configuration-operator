{{- $fwStorage := .Values.nicFirmwareStorage | default dict -}}
{{- $fwMode := $fwStorage.mode | default "local" -}}
{{- if $fwStorage.pvcName }}{{- $fwMode = "pvc" -}}{{- end -}}
{{- $localStorage := $fwStorage.localStorage | default dict -}}
{{- $localType := $localStorage.type | default "hostPath" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-configuration-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nic-configuration-daemon
    app.kubernetes.io/created-by: nic-configuration-operator
    app.kubernetes.io/part-of: nic-configuration-operator
    {{- include "nic-configuration-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      control-plane: nic-configuration-daemon
      {{- include "nic-configuration-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nic-configuration-daemon
      labels:
        control-plane: nic-configuration-daemon
        nvidia.com/nic-configuration-daemon: ""
        {{- include "nic-configuration-operator.selectorLabels" . | nindent 8 }}
    spec:
      nodeSelector: {{- toYaml .Values.configDaemon.nodeSelector | nindent 8 }}
      serviceAccountName: {{ include "nic-configuration-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      containers:
        - image: "{{ .Values.configDaemon.image.repository }}/{{ .Values.configDaemon.image.name }}:{{ .Values.configDaemon.image.tag | default .Chart.AppVersion }}"
          name: nic-configuration-daemon
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources: {{- toYaml .Values.configDaemon.resources | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FIRMWARE_STORAGE_MODE
              value: {{ $fwMode | quote }}
            {{- if .Values.configDaemon.env }}
            {{- toYaml .Values.configDaemon.env | nindent 12 }}
            {{- end }}
            {{- if .Values.logLevel}}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel }}
            {{- end}}
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: false
            - name: proc
              mountPath: /proc
              readOnly: false
            - name: host
              mountPath: /host
            - name: dev
              mountPath: /dev
              readOnly: false
            - name: firmware-cache
              mountPath: /nic-firmware
              # PVC mode mounts the shared cache read-only; local mode needs to write downloads.
              readOnly: {{ eq $fwMode "pvc" }}
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        - name: firmware-cache
        {{- if eq $fwMode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fwStorage.pvcName }}
        {{- else if eq $localType "hostPath" }}
          hostPath:
            path: {{ $localStorage.hostPath | default "/var/lib/nvidia/nic-configuration-operator/firmware" }}
            type: DirectoryOrCreate
        {{- else }}
          emptyDir: {}
        {{- end }}
