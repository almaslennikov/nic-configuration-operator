{{- $fwStorage := .Values.nicFirmwareStorage | default dict -}}
{{- $fwMode := $fwStorage.mode | default "local" -}}
{{- if $fwStorage.pvcName }}{{- $fwMode = "pvc" -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nic-configuration-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: nic-configuration-operator
    app.kubernetes.io/part-of: nic-configuration-operator
    {{- include "nic-configuration-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: {{ .Release.Name }}-controller-manager
      {{- include "nic-configuration-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: {{ .Release.Name }}-controller-manager
      {{- include "nic-configuration-operator.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      tolerations: {{- toYaml .Values.operator.tolerations | nindent 8 }}
      nodeSelector: {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      affinity: {{- toYaml .Values.operator.affinity | nindent 8 }}
      imagePullSecrets: {{ .Values.imagePullSecrets | default list | toJson }}
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
      serviceAccountName: {{ include "nic-configuration-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          command:
            - /manager
          image: "{{ .Values.operator.image.repository }}/{{ .Values.operator.image.name }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.logLevel}}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel }}
          {{- end}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The operator downloads and validates each NicFirmwareSource into /nic-firmware to populate
          # its status. In pvc mode this is the shared PVC; in local mode it is an ephemeral emptyDir
          # (status lives in the CR, so the on-disk cache is rebuilt on the next reconcile after a restart).
          volumeMounts:
            - name: firmware-cache
              mountPath: /nic-firmware
              readOnly: false
      volumes:
        - name: firmware-cache
        {{- if eq $fwMode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fwStorage.pvcName }}
        {{- else }}
          emptyDir: {}
        {{- end }}
