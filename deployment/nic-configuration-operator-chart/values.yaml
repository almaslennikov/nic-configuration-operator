operator:
  image:
    # -- repository to use for the operator image
    repository: harbor.mellanox.com/cloud-orchestration-dev
    name: nic-configuration-operator
    # -- image tag to use for the operator image
    tag: set_system_conf
  # -- tolerations for the operator
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  # -- node selector for the operator
  nodeSelector: {}
  # -- node affinity for the operator
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/master"
                operator: Exists
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: Exists
  # -- specify resource requests and limits for the operator
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  # -- operator deployment number of replicas
  replicas: 1
  serviceAccount:
    # -- set annotations for the operator service account
    annotations: {}

configDaemon:
  image:
    # -- repository to use for the config daemon image
    repository: harbor.mellanox.com/cloud-orchestration-dev
    name: nic-configuration-operator-daemon
    # -- image tag to use for the config daemon image
    tag: set_system_conf
  # -- environment variables for the config daemon
  # env:
    # -- feature gate to enable FW reset after nv config update
    # - name: FW_RESET_AFTER_CONFIG_UPDATE
    #   value: "true"
  # -- node selector for the config daemon
  # -- resources and limits for the config daemon
  resources:
    requests:
      cpu: 10m
      memory: 512Mi

# -- log level configuration (debug|info)
logLevel: info
# -- image pull secrets for both the operator and the config daemon
imagePullSecrets: []

# -- settings for the firmware cache used during NIC firmware updates
nicFirmwareStorage:
  # -- storage mode: "local" (each daemon downloads the firmware it needs to node-local storage,
  #    no shared PVC required) or "pvc" (operator downloads to a shared ReadWriteMany PVC that all
  #    daemons read). Setting pvcName below forces "pvc" mode regardless of this value. In both modes
  #    the operator still validates each NicFirmwareSource and populates its status.
  mode: local
  # -- node-local storage backing for the daemon when mode is "local"
  localStorage:
    # -- "hostPath" (default; cache persists across daemon restarts and supports air-gapped
    #    pre-staging) or "emptyDir" (ephemeral; re-downloaded on every daemon pod restart)
    type: hostPath
    # -- host directory used when type is "hostPath"
    hostPath: /var/lib/nvidia/nic-configuration-operator/firmware
  # -- (pvc mode) create a new pvc for the firmware cache or use an existing one
  create: false
  # -- (pvc mode) name of the PVC for the shared firmware cache; setting this forces "pvc" mode
  pvcName: ""
  # -- (pvc mode) storage class for the created PVC (empty uses the cluster default)
  storageClassName: ""
  # -- (pvc mode) requested size for the created PVC
  availableStorageSize: 1Gi
